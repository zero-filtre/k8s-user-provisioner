name: Python CI/CD Pipeline with k8s

on:
  push:
    branches: 
      - 'otlp*'

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      tag_number: ${{ github.run_number }}
      username: ${{ secrets.DOCKER_HUB_USERNAME }}
      password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      namespace: ${{ secrets.K8S_USERNAME }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Docker Login
      uses: docker/login-action@v2.1.0
      with:
          username: ${{ env.username }}
          password: ${{ env.password }}


    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags:  ${{ env.username }}/zerofiltretech-provisioner:${{ env.tag_number }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new
        

    - name: Set up kubectl
      uses: tale/kubectl-action@v1
      with:
        base64-kube-config: ${{ secrets.KUBE_CONFIG }}

    - name: Set up k8s manifest
      run: |
        envsubst < microservice.yaml > k8s.yaml
        cat k8s.yaml

    - name: Deploy to k8s
      run: |
        kubectl apply -f k8s.yaml
        kubectl annotate deployment zerofiltretech-provisioner kubernetes.io/change-cause="version change to: ${{ env.tag_number }} " -n ${{ env.namespace }} --overwrite=true
        if ! kubectl rollout status -w deployment/zerofiltretech-provisioner -n ${{ env.namespace }}; then
              kubectl rollout undo deployment.v1.apps/zerofiltretech-provisioner -n ${{ env.namespace }}
              kubectl rollout status deployment/zerofiltretech-provisioner -n ${{ env.namespace }}
              exit 1
        fi

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache