apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ${namespace}
  name: zerofiltretech-provisioner
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 120
  replicas: 1
  selector:
    matchLabels:
      app: zerofiltretech-provisioner
  template:
    metadata:
      labels:
        app: zerofiltretech-provisioner
    spec:
      containers:
        - name: zerofiltretech-provisioner
          image: ${username}/zerofiltretech-provisioner:${tag_number}
          imagePullPolicy: IfNotPresent
          ports:
          - name: http-port
            containerPort: 5000
            protocol: TCP
          resources:
            requests:
              cpu: '0.1'
              memory: '50Mi'
            limits:
              cpu: '0.5'
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  namespace: ${namespace}
  name: zerofiltretech-provisioner
spec:
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  selector:
    app: zerofiltretech-provisioner
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: ${namespace}
  name: zerofiltretech-provisioner
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: ${namespace}.provisioner.zerofiltre.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zerofiltretech-provisioner
                port:
                  number: 5000
  tls: 
  - hosts:
    - ${namespace}.provisioner.zerofiltre.tech
    secretName: zerofiltretech-provisioner-cert